name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov-fail-under=85

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      # validate needs the zip referenced by filebase64sha256()
      - run: mkdir -p ../../build && touch ../../build/lambda.zip
      - run: terraform validate

  dbt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt/life
    env:
      DBT_ATHENA_STAGING_DIR: s3://placeholder/staging/
      DBT_ATHENA_DATA_DIR: s3://placeholder/curated/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install dbt-athena-community
      # parse checks SQL/Jinja and refs without connecting to AWS
      - run: dbt parse --profiles-dir .
