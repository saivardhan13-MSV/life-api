name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC: short-lived AWS credentials, no stored keys
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: prod
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_github_repo: ${{ github.repository }}
      TF_VAR_timezone: ${{ vars.TIMEZONE || 'America/New_York' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_lambda.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: infra/terraform
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=life-api/prod.tfstate"
          -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"
      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve
      - name: Smoke test
        working-directory: infra/terraform
        run: |
          API=$(terraform output -raw api_url)
          curl -fsS "$API/health"
          curl -fsS "$API/public/summary" | python -m json.tool
