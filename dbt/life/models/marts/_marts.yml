version: 2

models:
  - name: fct_daily_life
    description: >
      One row per calendar day combining sleep, activity, screen time and job applications.
      Days with no data still appear (nulls), so gaps in tracking are visible.
    columns:
      - name: activity_date
        tests: [unique, not_null]
      - name: applications_sent
        tests: [not_null]
      - name: next_night_sleep_minutes
        description: Sleep recorded the following day, i.e. the night after this day's scrolling.

  - name: fct_application_funnel
    description: Weekly application funnel and response rate.
    columns:
      - name: week_start
        tests: [unique, not_null]
