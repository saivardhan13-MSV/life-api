# Credentials come from the standard AWS chain (env vars, SSO profile, or GitHub OIDC).
# Values below come from `terraform output` and are passed as env vars.
life:
  target: prod
  outputs:
    prod:
      type: athena
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      database: awsdatacatalog
      schema: "{{ env_var('DBT_ATHENA_SCHEMA', 'life_api_curated') }}"
      s3_staging_dir: "{{ env_var('DBT_ATHENA_STAGING_DIR') }}"
      s3_data_dir: "{{ env_var('DBT_ATHENA_DATA_DIR') }}"
      s3_data_naming: schema_table
      work_group: "{{ env_var('DBT_ATHENA_WORKGROUP', 'life-api') }}"
      threads: 4
